<!doctype html>
<html lang="zh-HK">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- ⚠️ 手機瀏覽器上下條邊嘅顏色。⛔ 唔跟返深色底就會喺 app 上下各出一條淺色帶。 -->
    <meta name="theme-color" content="#0D120E" />
    <title>森伝現場報價記錄</title>
    <!--
      內文無襯線體 ＋ 標題襯線體（同 stage57 一模一樣嗰兩隻）。
      ⚠️ 2026-09-02：本來只搬咗襯線體，內文仲用緊 iPhone 自己嘅 PingFang，

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=Noto+Serif+TC:wght@600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
  </head>
